<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0F0D" />
  <title>Aera — the air, in every photo</title>
  <meta name="description" content="A camera that stamps your photo with the air quality where it was taken." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/app.css" />
</head>
<body>
  <!-- Home: the shutter opens the phone's own camera (full-quality photos) -->
  <section class="screen home" id="home" aria-label="Aera">
    <div class="home-inner">
      <h1 class="wordmark">AERA</h1>
      <p class="pitch">Take a photo. Aera adds the air you’re breathing.</p>
      <p class="notice" id="notice" role="status" hidden></p>
    </div>
    <div class="camera-bar">
      <button class="gallery-btn" id="galleryBtn" aria-label="Your photos">
        <img id="galleryThumb" alt="" hidden />
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><rect x="13" y="13" width="7" height="7" rx="1.5" /></svg>
      </button>
      <button class="shutter" id="shutter" aria-label="Take a photo"><span></span></button>
      <span class="icon-btn spacer" aria-hidden="true"></span>
    </div>
    <div class="home-alt">
      <button class="btn ghost recent" data-pick>
        <span>Use a photo you just took</span>
        <small>Best quality · from your camera app</small>
      </button>
    </div>
    <p class="fine home-note">Photos stay on your device.</p>
  </section>

  <!-- Preview -->
  <section class="screen preview" id="preview" aria-label="Your air report" hidden>
    <div class="frame">
      <div class="stack" id="stack">
        <span class="drag-hint" id="dragHint" hidden>Drag to frame</span>
        <canvas id="canvas" width="1080" height="1920" aria-hidden="true"></canvas>
        <img id="previewImg" alt="Your photo with its air report" hidden />
      </div>
    </div>
    <div class="preview-bar">
      <div class="info-row">
        <button class="place" id="place" aria-haspopup="dialog">Reading the air…</button>
        <button class="scene-toggle" id="sceneToggle" aria-expanded="false" aria-controls="scenes">Sticker: …</button>
      </div>
      <div class="chips" id="scenes" role="group" aria-label="Sticker" hidden></div>
      <div class="actions row">
        <button class="btn ghost" id="retake">Retake</button>
        <button class="btn primary" id="save" disabled>Share</button>
        <button class="icon-btn outline" id="download" aria-label="Save image" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14" /></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Gallery: finished photos, stored only on this device -->
  <section class="screen gallery" id="gallery" aria-labelledby="galleryTitle" hidden>
    <header class="gallery-head">
      <button class="icon-btn" data-back aria-label="Back to camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h1 id="galleryTitle">Your photos</h1>
      <button class="icon-btn" data-pick aria-label="Import a photo from your phone">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </header>
    <ul class="grid" id="grid"></ul>
    <div class="empty" id="galleryEmpty" hidden>
      <p>Photos you take with Aera show up here.</p>
      <button class="btn ghost" data-pick>Import a photo</button>
    </div>
    <p class="fine gallery-note" id="galleryNote">Saved only on this device.</p>
  </section>

  <!-- Viewer: one saved photo -->
  <section class="screen viewer" id="viewer" aria-label="Photo" hidden>
    <div class="frame"><img id="viewerImg" alt="Your photo with its air report" /></div>
    <div class="preview-bar">
      <div class="actions row">
        <button class="icon-btn outline" data-back aria-label="Back to your photos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="btn primary" id="viewerShare">Share</button>
        <button class="icon-btn outline" id="viewerSave" aria-label="Save image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14" /></svg>
        </button>
        <button class="icon-btn outline" id="viewerDelete" aria-label="Delete photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" /></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Where was this taken? (photos without a location, or to change it) -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheetTitle">Where was this taken?</h2>
        <button class="icon-btn" id="sheetClose" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <input class="search" id="placeQuery" type="search" placeholder="Search a city" autocomplete="off" enterkeyhint="search" aria-label="Search a city" />
      <ul class="results" id="placeResults"></ul>
    </div>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  <input id="capture" type="file" accept="image/*" capture="environment" hidden />
  <input id="file" type="file" accept="image/*" hidden />
  <script type="module" src="src/app.js"></script>
</body>
</html>
